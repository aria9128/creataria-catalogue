name: CREATARIA — veille et publication automatique

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: creataria-catalog-publication
  cancel-in-progress: true

jobs:
  discover-generate-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le catalogue
        uses: actions/checkout@v6

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Chercher des idées et générer des fiches originales
        run: python catalog_robot.py

      - name: Enregistrer les changements du robot
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add creations.json catalogue_grid_status.json manifest.json catalog_robot_state.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "CREATARIA: nouvelles fiches découvertes automatiquement"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Préparer GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Préparer le site du catalogue
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Publier le catalogue et son manifeste
        if: steps.commit.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          token: ${{ github.token }}
